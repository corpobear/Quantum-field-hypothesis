<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <marker id="sipka" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#50d050"/>
    </marker>
  </defs>
  <rect width="1100" height="720" fill="#0b1020"/>
  <text x="50" y="55" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="30">Trojita relacna uzavierka</text>
  <text x="50" y="88" fill="#b8c7d9" font-family="Arial, sans-serif" font-size="16">Tri relacne kanaly tvoria najmensi uzavrety obvod: A -> B -> C -> A. Zlyhany stvrty mod ostava v strede ako rezervoar R_4.</text>

  <g transform="translate(550 390)">
    <circle cx="0" cy="0" r="245" fill="none" stroke="#2e4669" stroke-width="3"/>
    <circle cx="0" cy="-210" r="45" fill="#15213a" stroke="#4aa3ff" stroke-width="4"/>
    <circle cx="182" cy="105" r="45" fill="#15213a" stroke="#4aa3ff" stroke-width="4"/>
    <circle cx="-182" cy="105" r="45" fill="#15213a" stroke="#4aa3ff" stroke-width="4"/>
    <text x="-13" y="-203" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="26">A</text>
    <text x="169" y="112" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="26">B</text>
    <text x="-196" y="112" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="26">C</text>
    <path d="M 35 -190 Q 180 -120 172 58" fill="none" stroke="#50d050" stroke-width="5" marker-end="url(#sipka)"/>
    <path d="M 135 123 Q 0 250 -135 123" fill="none" stroke="#50d050" stroke-width="5" marker-end="url(#sipka)"/>
    <path d="M -172 58 Q -180 -120 -35 -190" fill="none" stroke="#50d050" stroke-width="5" marker-end="url(#sipka)"/>

    <circle cx="0" cy="0" r="64" fill="#3a2132" stroke="#ff8a3d" stroke-width="4"/>
    <text x="-23" y="8" fill="#ffd8b0" font-family="Arial, sans-serif" font-size="24">R_4</text>
    <text x="-106" y="92" fill="#ffb36b" font-family="Arial, sans-serif" font-size="17">zlyhany stvrty mod</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="70" y="620" width="960" height="52" rx="12" fill="#11192e" stroke="#2e4669"/>
    <text x="95" y="653" fill="#e7eefc">Pracovny princip: stabilna manifestacia vyzaduje uzavretu relacnu informaciu; najmensia taka struktura je trojita.</text>
  </g>
</svg>
