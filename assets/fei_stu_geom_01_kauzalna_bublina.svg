<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#0b1020"/>
  <text x="50" y="55" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="30">Geometria kauzalnej bubliny a svetelneho kuzela</text>
  <text x="50" y="88" fill="#b8c7d9" font-family="Arial, sans-serif" font-size="16">Zakladny objekt: centrum udalosti, expandujuca dvojrozmerna kauzalna plocha a radialna vzdialenost r = c Delta t.</text>

  <g transform="translate(300 390)">
    <circle cx="0" cy="0" r="10" fill="#ffd34a"/>
    <text x="18" y="5" fill="#f4f8ff" font-family="Arial, sans-serif" font-size="17">centrum udalosti C_i</text>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#4aa3ff" stroke-width="2" opacity="0.55"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#4aa3ff" stroke-width="3" opacity="0.75"/>
    <circle cx="0" cy="0" r="225" fill="none" stroke="#4aa3ff" stroke-width="4" opacity="0.95"/>
    <line x1="0" y1="0" x2="225" y2="0" stroke="#50d050" stroke-width="4"/>
    <text x="95" y="-15" fill="#50d050" font-family="Arial, sans-serif" font-size="18">r_i(n,t)</text>
    <text x="-96" y="-238" fill="#b8c7d9" font-family="Arial, sans-serif" font-size="16">S_i(theta, phi, t)</text>
  </g>

  <g transform="translate(760 390)">
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#95a8c2" stroke-width="2"/>
    <line x1="-260" y1="220" x2="260" y2="220" stroke="#95a8c2" stroke-width="2"/>
    <text x="12" y="-245" fill="#95a8c2" font-family="Arial, sans-serif" font-size="15">cas t</text>
    <text x="228" y="245" fill="#95a8c2" font-family="Arial, sans-serif" font-size="15">priestor</text>
    <path d="M 0 210 L -210 -190" fill="none" stroke="#ff8a3d" stroke-width="4"/>
    <path d="M 0 210 L 210 -190" fill="none" stroke="#ff8a3d" stroke-width="4"/>
    <path d="M 0 210 L -125 -45" fill="none" stroke="#ff8a3d" stroke-width="2" opacity="0.45"/>
    <path d="M 0 210 L 125 -45" fill="none" stroke="#ff8a3d" stroke-width="2" opacity="0.45"/>
    <circle cx="0" cy="210" r="9" fill="#ffd34a"/>
    <text x="-120" y="-210" fill="#ffb36b" font-family="Arial, sans-serif" font-size="18">historia plochy tvori svetelny kuzel</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="70" y="620" width="960" height="52" rx="12" fill="#11192e" stroke="#2e4669"/>
    <text x="95" y="653" fill="#e7eefc">V plochom pripade: r_i = c Delta t. V deformovanom pripade: r_i(n,t) = c Delta t rho_i(n).</text>
  </g>
</svg>
