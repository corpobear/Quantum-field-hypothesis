<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Kauzálna bublina a svetelný kužeľ">
  <rect width="1000" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="520" rx="18" fill="#f8fafc" stroke="#d8dee9"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Kauzálna bublina ako geometria svetelného kužeľa</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">Svetelný kužeľ sa číta ako časová história expandujúcej 2D kauzálnej plochy.</text>

  <g transform="translate(500 430)">
    <circle cx="0" cy="0" r="9" fill="#dd6b20"/>
    <text x="18" y="5" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">Cᵢ - centrum udalosti</text>
    <line x1="0" y1="0" x2="-310" y2="-270" stroke="#2b6cb0" stroke-width="6"/>
    <line x1="0" y1="0" x2="310" y2="-270" stroke="#2b6cb0" stroke-width="6"/>
    <ellipse cx="0" cy="-70" rx="110" ry="20" fill="none" stroke="#8fb3d9" stroke-width="3"/>
    <ellipse cx="0" cy="-140" rx="180" ry="25" fill="none" stroke="#8fb3d9" stroke-width="3"/>
    <ellipse cx="0" cy="-210" rx="250" ry="30" fill="none" stroke="#8fb3d9" stroke-width="3"/>
    <ellipse cx="0" cy="-270" rx="330" ry="34" fill="none" stroke="#8fb3d9" stroke-width="3"/>
    <text x="80" y="-115" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2b6cb0">r = c Δt</text>
    <text x="120" y="-238" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6b46c1">Sᵢ(θ, φ, t)</text>
    <text x="-220" y="-312" font-family="Arial, sans-serif" font-size="20" fill="#4a5568">časová história 2D kauzálnej plochy</text>
  </g>

  <text x="60" y="515" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">Princíp: najprv sa definuje geometria kauzálnej plochy; fyzikálna interpretácia prichádza až po odvodení redukovaných veličín.</text>
</svg>
