<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Trojitá relačná uzávierka">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f855a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="520" rx="18" fill="#f8fafc" stroke="#d8dee9"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Trojitá uzávierka ako minimálna stabilná relácia</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="18" fill="#4a5568">Dvojica vytvára rozdiel; trojica vytvára prvý uzavretý obvod spätnej väzby.</text>

  <g transform="translate(500 300)">
    <circle cx="0" cy="-150" r="48" fill="#edf2ff" stroke="#2b6cb0" stroke-width="6"/>
    <circle cx="-165" cy="105" r="48" fill="#edf2ff" stroke="#2b6cb0" stroke-width="6"/>
    <circle cx="165" cy="105" r="48" fill="#edf2ff" stroke="#2b6cb0" stroke-width="6"/>
    <text x="-13" y="-140" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#2b6cb0">A</text>
    <text x="-178" y="116" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#2b6cb0">B</text>
    <text x="152" y="116" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#2b6cb0">C</text>

    <line x1="-35" y1="-115" x2="-132" y2="62" stroke="#2f855a" stroke-width="7" marker-end="url(#arrow)"/>
    <line x1="-110" y1="105" x2="110" y2="105" stroke="#2f855a" stroke-width="7" marker-end="url(#arrow)"/>
    <line x1="135" y1="65" x2="34" y2="-113" stroke="#2f855a" stroke-width="7" marker-end="url(#arrow)"/>

    <circle cx="0" cy="20" r="56" fill="#fff5f5" stroke="#c53030" stroke-width="6"/>
    <text x="-24" y="32" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#c53030">R₄</text>
  </g>

  <text x="205" y="495" font-family="Arial, sans-serif" font-size="19" fill="#4a5568">A → B → C → A; zlyhaný štvrtý mód ostáva ako centrálny rezervoár.</text>
</svg>
